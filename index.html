<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="TraHis personal finance tracker">
  <title>TraHis</title>
  <!-- Manifest is injected only on http/https so file:// testing has no CORS error. -->
  <link id="pwaManifest" rel="manifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/bootstrap.min.css">
  <link rel="stylesheet" href="assets/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<!-- Header -->
<header id="appHeader" class="app-header">
  <div class="header-inner">
    <a class="brand" href="#" data-route="dashboard"><img src="assets/icon.svg" alt="TraHis"> <span>TraHis</span></a>
    <div class="header-actions">
      <span id="headerUser" class="header-user"></span>
      <button id="headerMenuBtn" class="icon-btn" aria-label="Open menu"><i class="bi bi-person-circle"></i></button>
    </div>
  </div>
</header>

<!-- Side drawer -->
<div id="drawerOverlay" class="drawer-overlay"></div>
<aside id="appDrawer" class="app-drawer">
  <div class="drawer-top">
    <div class="drawer-brand"><img src="assets/icon.svg" alt=""><div><strong>TraHis</strong><small>Personal finance</small></div></div>
    <button id="closeDrawer" class="icon-btn"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="drawer-user" id="drawerUser"></div>
  <nav class="drawer-nav">
    <button data-route="profile"><i class="bi bi-person"></i><span>Profile</span></button>
    <button data-route="backup"><i class="bi bi-cloud-arrow-down"></i><span>Backup & Restore</span></button>
    <button id="adminNav" data-route="admin"><i class="bi bi-shield-check"></i><span>Admin</span></button>
    <button id="logoutBtn" class="danger"><i class="bi bi-box-arrow-right"></i><span>Logout</span></button>
  </nav>
  <div class="drawer-foot">Local-only data • No server database</div>
</aside>

<main id="main" class="main-shell"></main>

<!-- Bottom navigation -->
<nav id="bottomNav" class="bottom-nav">
  <button data-route="dashboard" class="active"><i class="bi bi-grid-1x2-fill"></i><span>Home</span></button>
  <button data-route="add"><i class="bi bi-plus-circle"></i><span>Add</span></button>
  <button data-route="transfer"><i class="bi bi-arrow-left-right"></i><span>Transfer</span></button>
  <button data-route="history"><i class="bi bi-clock-history"></i><span>History</span></button>
</nav>

<div id="toastBox" class="toast-container position-fixed top-0 end-0 p-3"></div>
<input id="restoreFile" type="file" accept=".json,application/json" hidden>

<script src="assets/jquery.min.js"></script>
<script src="assets/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
