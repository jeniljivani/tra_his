<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="TraHis app tutorial">
  <title>App Tutorial • TraHis</title>
  <link id="pwaManifest" rel="manifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/bootstrap.min.css">
  <link rel="stylesheet" href="assets/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tutorial-hero{background:linear-gradient(135deg,var(--primary-soft),var(--card));border:1px solid var(--border);border-radius:20px;padding:22px;position:relative;overflow:hidden}
    .tutorial-hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:var(--primary);opacity:.07;right:-55px;top:-70px}
    .tour-progress{height:7px;background:var(--primary-soft);border-radius:99px;overflow:hidden}.tour-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .35s ease}
    .tour-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
    .tour-menu{display:flex;flex-direction:column;gap:7px}.tour-menu button{border:1px solid var(--border);background:var(--card);color:var(--text);padding:12px;border-radius:12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:600}.tour-menu button.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
    .tour-menu .tour-dot{width:30px;height:30px;border-radius:9px;background:var(--primary-soft);display:grid;place-items:center;flex:none}
    .tour-content{min-height:440px}.tour-panel{display:none;animation:tourIn .3s ease}.tour-panel.active{display:block}@keyframes tourIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .mock-window{border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 15px 45px rgba(15,23,42,.08)}.mock-top{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center}.mock-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);opacity:.45}.mock-body{padding:18px}.mock-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mock-kpi{padding:13px;border:1px solid var(--border);border-radius:13px}.mock-line{height:10px;background:var(--primary-soft);border-radius:99px;margin:10px 0}.mock-line.w70{width:70%}.mock-line.w45{width:45%}.mock-list{display:grid;gap:8px;margin-top:15px}.mock-row{padding:11px;border:1px solid var(--border);border-radius:11px;display:flex;justify-content:space-between}.highlight{outline:3px solid color-mix(in srgb,var(--primary) 28%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--primary) 8%,transparent)}
    .tour-copy{padding:16px 0}.tour-copy h3{margin-bottom:6px}.tour-copy p{color:var(--muted);margin-bottom:0}.tour-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.tour-actions button{min-width:110px}.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.topic-card{padding:15px;border:1px solid var(--border);border-radius:14px;background:var(--card)}.topic-card button{border:0;background:none;color:var(--primary);font-weight:700;padding:0;margin-top:8px}
    .faq-item{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--card)}.faq-item+.faq-item{margin-top:9px}.faq-q{width:100%;padding:14px;background:none;border:0;color:var(--text);text-align:left;font-weight:700;display:flex;justify-content:space-between}.faq-a{display:none;padding:0 14px 14px;color:var(--muted);font-size:.92rem}.faq-item.open .faq-a{display:block}
    @media(max-width:800px){.tour-layout{grid-template-columns:1fr}.tour-menu{display:grid;grid-template-columns:repeat(2,1fr)}.tour-menu button{font-size:.88rem}.tour-content{min-height:0}}
    @media(max-width:520px){.tour-menu,.topic-grid{grid-template-columns:1fr}.mock-kpis{grid-template-columns:1fr}.mock-body{padding:13px}.tutorial-hero{padding:17px}.tour-actions button{min-width:0;flex:1}}

    .tour-menu-btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:12px;border-radius:12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:600}.tour-menu-btn small{display:block;color:var(--muted);font-weight:500;margin-top:2px}.tour-menu-btn.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}.tour-menu-btn:focus-visible,.tour-actions button:focus-visible,.topic-open:focus-visible,.faq-q:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 30%,transparent);outline-offset:2px}.tour-dot{width:30px;height:30px;border-radius:9px;background:var(--primary-soft);display:grid;place-items:center;flex:none;color:var(--primary)}.tutorial-page .cardx{padding:18px}.tutorial-page .btn{white-space:nowrap}.tutorial-page .badge{border:1px solid var(--border)}
  </style>
</head>
<body data-page="tutorial">
<div id="app"></div>

<script src="assets/jquery.min.js"></script><script src="assets/bootstrap.bundle.min.js"></script><script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
